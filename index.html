<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snow Rush 3D</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#9fc4e8;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  padding:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.leftHUD{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.row{
  display:flex;
  gap:7px;
}

.box{
  color:white;
  background:rgba(20,40,65,.55);
  border:1px solid rgba(255,255,255,.3);
  padding:8px 13px;
  border-radius:18px;
  font-weight:bold;
  font-size:17px;
  backdrop-filter:blur(8px);
}

#lives{
  font-size:20px;
}

#power{
  display:none;
}

.buttons{
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.topButton{
  width:44px;
  height:44px;
  border:0;
  border-radius:15px;
  background:rgba(20,40,65,.55);
  color:white;
  font-size:19px;
}

#overlay{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(
    rgba(10,30,55,.45),
    rgba(10,45,70,.55)
  );
}

.card{
  width:100%;
  max-width:370px;
  text-align:center;
  color:white;
}

.hidden{
  display:none!important;
}

.logo{
  font-size:62px;
  margin-bottom:5px;
}

.title{
  font-size:45px;
  font-weight:900;
  text-shadow:0 3px 12px #18344d;
}

.subtitle{
  color:#bdefff;
  font-weight:bold;
  letter-spacing:8px;
  font-size:21px;
  margin-bottom:18px;
}

.best{
  margin-bottom:24px;
  font-size:17px;
}

.play{
  width:100%;
  padding:16px;
  border:0;
  border-radius:18px;
  font-size:20px;
  font-weight:bold;
  background:linear-gradient(90deg,#38bdf8,#67e8f9);
  color:#092238;
  box-shadow:0 8px 25px rgba(0,200,255,.35);
}

.secondary{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.13);
  color:white;
  font-weight:bold;
  font-size:16px;
}

.hints{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.hint{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:15px;
  padding:12px;
  font-size:13px;
}

.hint b{
  display:block;
  margin-bottom:3px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:20px 0;
}

.stat{
  background:rgba(255,255,255,.13);
  border-radius:17px;
  padding:15px;
}

.stat small{
  opacity:.7;
}

.stat strong{
  display:block;
  font-size:30px;
  margin-top:4px;
}

#touchControls{
  position:fixed;
  left:0;
  right:0;
  bottom:15px;
  z-index:6;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.touchGroup{
  display:flex;
  gap:9px;
}

.touchBtn{
  pointer-events:auto;
  width:58px;
  height:58px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:20px;
  background:rgba(20,40,65,.48);
  color:white;
  font-size:25px;
  backdrop-filter:blur(7px);
}

#message{
  position:fixed;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:7;
  color:white;
  background:rgba(10,30,50,.55);
  padding:9px 18px;
  border-radius:20px;
  font-weight:bold;
  opacity:0;
  transition:.2s;
}

#message.show{
  opacity:1;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud" class="hidden">

  <div class="leftHUD">

    <div class="row">
      <div class="box">
        ⭐ <span id="score">0</span>
      </div>

      <div class="box">
        🪙 <span id="coins">0</span>
      </div>
    </div>

    <div class="box" id="lives">
      ❤️ ❤️ ❤️
    </div>

    <div class="box hidden" id="power">
      🛡️ <span id="powerText">Shield</span>
    </div>

  </div>

  <div class="buttons">

    <button class="topButton" id="soundBtn">
      🔊
    </button>

    <button class="topButton" id="pauseBtn">
      ⏸️
    </button>

  </div>

</div>

<div id="touchControls" class="hidden">

  <div class="touchGroup">
    <button class="touchBtn" id="leftBtn">◀</button>
    <button class="touchBtn" id="rightBtn">▶</button>
  </div>

  <div class="touchGroup">
    <button class="touchBtn" id="jumpBtn">⬆</button>
    <button class="touchBtn" id="slideBtn">⬇</button>
  </div>

</div>

<div id="message"></div>

<div id="overlay">

  <!-- START -->

  <div class="card" id="startCard">

    <div class="logo">❄️</div>

    <div class="title">
      Snow Rush
    </div>

    <div class="subtitle">
      3D
    </div>

    <div class="best">
      🏆 Best Score:
      <span id="startBest">0</span>
    </div>

    <button class="play" id="playBtn">
      ▶ PLAY
    </button>

    <div class="hints">

      <div class="hint">
        <b>← →</b>
        Change lane
      </div>

      <div class="hint">
        <b>↑</b>
        Jump
      </div>

      <div class="hint">
        <b>↓</b>
        Slide
      </div>

      <div class="hint">
        <b>🪙</b>
        Collect coins
      </div>

    </div>

  </div>

  <!-- PAUSE -->

  <div class="card hidden" id="pauseCard">

    <div class="title" style="font-size:36px">
      PAUSED
    </div>

    <button class="play" id="resumeBtn"
            style="margin-top:25px">
      ▶ RESUME
    </button>

    <button class="secondary" id="menuBtn">
      🏠 MAIN MENU
    </button>

  </div>

  <!-- GAME OVER -->

  <div class="card hidden" id="gameOverCard">

    <div class="logo">🛷</div>

    <div class="title" style="font-size:36px">
      GAME OVER
    </div>

    <div id="newHigh"
         style="color:#ffe082;font-weight:bold;margin-top:10px"
         class="hidden">
      ⭐ NEW HIGH SCORE!
    </div>

    <div class="stats">

      <div class="stat">
        <small>SCORE</small>
        <strong id="finalScore">0</strong>
      </div>

      <div class="stat">
        <small>COINS</small>
        <strong id="finalCoins">0</strong>
      </div>

    </div>

    <div class="best">
      🏆 Best:
      <span id="finalBest">0</span>
    </div>

    <button class="play" id="restartBtn">
      🔄 RUN AGAIN
    </button>

    <button class="secondary" id="menuBtn2">
      🏠 MAIN MENU
    </button>

  </div>

</div>


<script type="module">

import * as THREE from
"https://unpkg.com/three@0.171.0/build/three.module.js";


/* =========================
   BASIC SETTINGS
========================= */

const LANES = [-2.7,0,2.7];

const ROAD_WIDTH = 9;

const START_SPEED = 18;

const MAX_SPEED = 48;

const rand = (a,b)=>
  a + Math.random()*(b-a);

const choose = arr =>
  arr[Math.floor(Math.random()*arr.length)];

const clamp = (v,a,b)=>
  Math.max(a,Math.min(b,v));


/* =========================
   UI
========================= */

const $ = id => document.getElementById(id);

const UI = {

  hud:$("hud"),
  overlay:$("overlay"),

  start:$("startCard"),
  pause:$("pauseCard"),
  over:$("gameOverCard"),

  score:$("score"),
  coins:$("coins"),
  lives:$("lives"),

  power:$("power"),
  powerText:$("powerText"),

  startBest:$("startBest"),
  finalScore:$("finalScore"),
  finalCoins:$("finalCoins"),
  finalBest:$("finalBest"),

  newHigh:$("newHigh"),

  controls:$("touchControls"),

  message:$("message")
};


/* =========================
   AUDIO
========================= */

class Sound {

  constructor(){

    this.ctx=null;
    this.master=null;
    this.muted=false;

  }

  init(){

    if(this.ctx)return;

    try{

      const AC =
        window.AudioContext ||
        window.webkitAudioContext;

      this.ctx=new AC();

      this.master=
        this.ctx.createGain();

      this.master.gain.value=.35;

      this.master.connect(
        this.ctx.destination
      );

    }catch(e){}

  }

  resume(){

    if(this.ctx &&
       this.ctx.state==="suspended"){

      this.ctx.resume();

    }

  }

  tone(freq,duration,type="sine"){

    if(!this.ctx || this.muted)return;

    const t=this.ctx.currentTime;

    const osc=
      this.ctx.createOscillator();

    const gain=
      this.ctx.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(
      freq,t
    );

    gain.gain.setValueAtTime(
      .001,t
    );

    gain.gain.exponentialRampToValueAtTime(
      .18,t+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,t+duration
    );

    osc.connect(gain);
    gain.connect(this.master);

    osc.start(t);
    osc.stop(t+duration+.02);

  }

  coin(){

    this.tone(800,.1,"triangle");

    setTimeout(()=>{
      this.tone(1200,.12,"triangle");
    },70);

  }

  jump(){

    this.tone(500,.18);

  }

  slide(){

    this.tone(250,.16,"sawtooth");

  }

  crash(){

    this.tone(100,.35,"sawtooth");

  }

  power(){

    this.tone(600,.1,"square");

    setTimeout(()=>{
      this.tone(900,.1,"square");
    },80);

    setTimeout(()=>{
      this.tone(1200,.15,"square");
    },160);

  }

}


/* =========================
   GAME
========================= */

class SnowRush {

  constructor(){

    this.sound=new Sound();

    this.state="menu";

    this.score=0;
    this.coins=0;
    this.lives=3;

    this.best=
      Number(
        localStorage.getItem(
          "snowRushBest"
        ) || 0
      );

    this.speed=START_SPEED;

    this.distance=0;

    this.lane=1;

    this.targetX=0;

    this.playerY=0;

    this.velocityY=0;

    this.jumping=false;

    this.sliding=false;

    this.slideTime=0;

    this.invulnerable=0;

    this.shield=0;

    this.magnet=0;

    this.boost=0;

    this.spawnTimer=0;

    this.coinTimer=0;

    this.powerTimer=0;

    this.objects=[];

    this.coinsObjects=[];

    this.powerObjects=[];

    this.env=[];

    this.clock=
      new THREE.Clock();

    this.lastTime=0;

    this.init();

  }


  /* =====================
     INIT
  ===================== */

  init(){

    const w=innerWidth;
    const h=innerHeight;

    this.renderer=
      new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:
          "high-performance"
      });

    this.renderer.setPixelRatio(
      Math.min(devicePixelRatio,1.7)
    );

    this.renderer.setSize(w,h);

    this.renderer.outputColorSpace=
      THREE.SRGBColorSpace;

    $("game").appendChild(
      this.renderer.domElement
    );


    this.scene=
      new THREE.Scene();

    this.scene.background=
      new THREE.Color(0x9fc4e8);

    this.scene.fog=
      new THREE.Fog(
        0xcfe2f2,
        60,
        300
      );


    this.camera=
      new THREE.PerspectiveCamera(
        67,
        w/h,
        .1,
        700
      );


    this.camera.position.set(
      0,4.8,9
    );


    /* LIGHT */

    this.scene.add(
      new THREE.HemisphereLight(
        0xeaf7ff,
        0x8294a8,
        1.2
      )
    );

    const sun=
      new THREE.DirectionalLight(
        0xffffff,
        1.3
      );

    sun.position.set(
      40,80,30
    );

    this.scene.add(sun);


    /* WORLD */

    this.createGround();

    this.createRoad();

    this.createMountains();

    this.createTrees();

    this.createSnow();

    this.createPlayer();


    this.setupControls();


    addEventListener(
      "resize",
      ()=>this.resize()
    );


    document.addEventListener(
      "visibilitychange",
      ()=>{
        if(
          document.hidden &&
          this.state==="playing"
        ){
          this.pause();
        }
      }
    );


    this.updateUI();

    this.animate();

  }


  /* =====================
     GROUND
  ===================== */

  createGround(){

    const geo=
      new THREE.PlaneGeometry(
        1000,1000
      );

    const mat=
      new THREE.MeshLambertMaterial({
        color:0xeaf3fa
      });

    const ground=
      new THREE.Mesh(
        geo,mat
      );

    ground.rotation.x=
      -Math.PI/2;

    ground.position.y=-.08;

    this.scene.add(ground);

  }


  /* =====================
     ROAD
  ===================== */

  createRoad(){

    const road=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROAD_WIDTH,
          1000
        ),
        new THREE.MeshLambertMaterial({
          color:0xd5e1eb
        })
      );

    road.rotation.x=
      -Math.PI/2;

    road.position.z=-480;

    road.position.y=0;

    this.scene.add(road);


    /* CENTER */

    const center=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          .12,1000
        ),
        new THREE.MeshBasicMaterial({
          color:0xf8c94b
        })
      );

    center.rotation.x=
      -Math.PI/2;

    center.position.y=.015;

    center.position.z=-480;

    this.scene.add(center);


    /* ROAD EDGES */

    for(const x of
      [-ROAD_WIDTH/2,
       ROAD_WIDTH/2]){

      const edge=
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .18,.08,1000
          ),
          new THREE.MeshLambertMaterial({
            color:0xffffff
          })
        );

      edge.position.set(
        x,.04,-480
      );

      this.scene.add(edge);

    }


    /* DASHED LANE MARKERS */

    for(let x of [-1.35,1.35]){

      for(let z=-5;
          z>-500;
          z-=12){

        const line=
          new THREE.Mesh(
            new THREE.BoxGeometry(
              .07,.025,5
            ),
            new THREE.MeshBasicMaterial({
              color:0xffffff
            })
          );

        line.position.set(
          x,.025,z
        );

        this.scene.add(line);

      }

    }

  }


  /* =====================
     MOUNTAINS
  ===================== */

  createMountains(){

    this.mountains=
      new THREE.Group();

    const snowMat=
      new THREE.MeshLambertMaterial({
        color:0xffffff
      });

    const rockMat=
      new THREE.MeshLambertMaterial({
        color:0x8da4b8
      });


    for(let i=0;i<18;i++){

      const h=rand(55,110);

      const r=rand(30,60);

      const mountain=
        new THREE.Group();

      const base=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            r,h,7
          ),
          rockMat
        );

      base.position.y=h/2;

      mountain.add(base);


      const snow=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            r*.58,
            h*.42,
            7
          ),
          snowMat
        );

      snow.position.y=
        h*.72;

      mountain.add(snow);


      const side=
        Math.random()<.5?-1:1;

      mountain.position.set(
        side*rand(150,260),
        0,
        rand(-300,50)
      );

      this.mountains.add(
        mountain
      );

    }

    this.scene.add(
      this.mountains
    );

  }


  /* =====================
     TREES / BUILDINGS
  ===================== */

  createTrees(){

    for(let i=0;i<45;i++){

      const side=
        Math.random()<.5?-1:1;

      const x=
        side*rand(
          ROAD_WIDTH/2+4,
          28
        );

      const z=
        rand(-300,10);

      if(Math.random()<.7){

        this.createTree(x,z);

      }else{

        this.createBuilding(x,z);

      }

    }

  }


  createTree(x,z){

    const group=
      new THREE.Group();


    const trunk=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .16,.23,1.4,6
        ),
        new THREE.MeshLambertMaterial({
          color:0x65442a
        })
      );

    trunk.position.y=.7;

    group.add(trunk);


    for(let i=0;i<3;i++){

      const cone=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            1.25-i*.22,
            1.7,
            7
          ),
          new THREE.MeshLambertMaterial({
            color:0x2e6541
          })
        );

      cone.position.y=
        1.35+i*.8;

      group.add(cone);


      const snow=
        new THREE.Mesh(
          new THREE.ConeGeometry(
            1.27-i*.22,
            .38,
            7
          ),
          new THREE.MeshLambertMaterial({
            color:0xffffff
          })
        );

      snow.position.y=
        1.9+i*.8;

      group.add(snow);

    }


    group.position.set(
      x,0,z
    );

    group.scale.setScalar(
      rand(.8,1.5)
    );

    this.scene.add(group);

    this.env.push(group);

  }


  createBuilding(x,z){

    const group=
      new THREE.Group();

    const h=
      rand(4,9);


    const body=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          rand(3,5),
          h,
          rand(3,5)
        ),
        new THREE.MeshLambertMaterial({
          color:choose([
            0x8da2b5,
            0xaebdca,
            0x7890a5
          ])
        })
      );

    body.position.y=h/2;

    group.add(body);


    const roof=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          4.3,.45,4
        ),
        new THREE.MeshLambertMaterial({
          color:0xffffff
        })
      );

    roof.position.y=h+.2;

    group.add(roof);


    for(let i=0;i<3;i++){

      const window=
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .55,.75,.08
          ),
          new THREE.MeshBasicMaterial({
            color:0xffe9a3
          })
        );

      window.position.set(
        -1+i,
        1.5,
        2.1
      );

      group.add(window);

    }


    group.position.set(
      x,0,z
    );

    this.scene.add(group);

    this.env.push(group);

  }


  /* =====================
     SNOW
  ===================== */

  createSnow(){

    const count=1200;

    const positions=
      new Float32Array(
        count*3
      );

    for(let i=0;i<count;i++){

      positions[i*3]=
        rand(-60,60);

      positions[i*3+1]=
        rand(0,45);

      positions[i*3+2]=
        rand(-100,30);

    }


    const geo=
      new THREE.BufferGeometry();

    geo.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,3
      )
    );


    const mat=
      new THREE.PointsMaterial({
        color:0xffffff,
        size:.32,
        transparent:true,
        opacity:.9
      });


    this.snow=
      new THREE.Points(
        geo,mat
      );

    this.scene.add(
      this.snow
    );

  }


  updateSnow(dt){

    const p=
      this.snow.geometry
      .attributes.position.array;

    for(let i=0;i<p.length;i+=3){

      p[i+1]-=dt*7;

      p[i]+=
        Math.sin(
          this.clock.elapsedTime+i
        )*.002;

      if(p[i+1]<0){

        p[i+1]=
          rand(35,45);

        p[i]=
          rand(
            this.camera.position.x-50,
            this.camera.position.x+50
          );

        p[i+2]=
          rand(
            this.camera.position.z-70,
            this.camera.position.z+20
          );

      }

    }

    this.snow.geometry
      .attributes.position
      .needsUpdate=true;

  }


  /* =====================
     PLAYER
  ===================== */

  createPlayer(){

    this.player=
      new THREE.Group();


    const coatMat=
      new THREE.MeshStandardMaterial({
        color:0xd93636,
        roughness:.65
      });

    const pantsMat=
      new THREE.MeshStandardMaterial({
        color:0x24344d,
        roughness:.7
      });

    const skinMat=
      new THREE.MeshStandardMaterial({
        color:0xf1c6a0
      });

    const darkMat=
      new THREE.MeshStandardMaterial({
        color:0x172337
      });


    /* BODY */

    const body=
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .3,.55,5,10
        ),
        coatMat
      );

    body.position.y=1.05;

    this.player.add(body);


    /* HEAD */

    const head=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .27,18,18
        ),
        skinMat
      );

    head.position.y=1.62;

    this.player.add(head);


    /* HAT */

    const hat=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .3,18,18,0,
          Math.PI*2,0,
