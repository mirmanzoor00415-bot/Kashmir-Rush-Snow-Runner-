<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Endless Runner</title>
<meta name="description" content="A mobile-friendly 3D endless runner game.">
<meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{
  position:fixed;top:12px;left:12px;right:12px;z-index:5;
  display:flex;justify-content:space-between;align-items:center;
  color:#fff;font-weight:700;text-shadow:0 2px 4px #0008;
  pointer-events:none
}
.panel{background:#0005;border:1px solid #fff4;border-radius:14px;padding:8px 12px;backdrop-filter:blur(5px)}
#message{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:10;color:white;text-align:center;background:#0008;
  padding:18px 24px;border-radius:18px;border:1px solid #fff4;
  text-shadow:0 2px 5px #000;pointer-events:none
}
#message b{font-size:24px}
#message small{display:block;margin-top:8px;font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">Score: <span id="score">0</span></div>
  <div class="panel">Coins: <span id="coins">0</span></div>
</div>

<div id="message">
  <b>3D RUNNER</b>
  <small>Swipe left/right to change lanes<br>Swipe up to jump</small>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bdcff);
scene.fog = new THREE.Fog(0x9bdcff, 42, 175);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 4.2, 11.8);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xcfeeff, 0x52604a, 1.8));

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-25,35,20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -15;
scene.add(sun);

// Materials
const roadMat = new THREE.MeshStandardMaterial({color:0x25282d,roughness:.9});
const sidewalkMat = new THREE.MeshStandardMaterial({color:0x9b9b9b,roughness:.9});
const curbMat = new THREE.MeshStandardMaterial({color:0xd6d6d6,roughness:.8});
const whiteMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.8});
const yellowMat = new THREE.MeshStandardMaterial({color:0xffd32a,roughness:.65});
const darkMat = new THREE.MeshStandardMaterial({color:0x17191d,roughness:.8});
const skinMat = new THREE.MeshStandardMaterial({color:0xc98d65,roughness:.75});
const shirtMat = new THREE.MeshStandardMaterial({color:0x1769aa,roughness:.75});
const pantsMat = new THREE.MeshStandardMaterial({color:0x26364d,roughness:.8});
const shoeMat = new THREE.MeshStandardMaterial({color:0x111318,roughness:.75});

// Utility
function box(w,h,d,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}

// Road
const road = box(12,0.22,220,roadMat,0,-0.12,-65);
scene.add(road);

const leftWalk = box(4,0.28,220,sidewalkMat,-8,0,-65);
const rightWalk = box(4,0.28,220,sidewalkMat,8,0,-65);
scene.add(leftWalk,rightWalk);

scene.add(
  box(.28,.32,220,curbMat,-6.05,.05,-65),
  box(.28,.32,220,curbMat,6.05,.05,-65)
);

// Road edge lines for a cleaner, more premium track.
const edgeMat = new THREE.MeshStandardMaterial({color:0xffd84d, roughness:.75});
scene.add(
  box(.10,.035,220,edgeMat,-5.82,.025,-65),
  box(.10,.035,220,edgeMat,5.82,.025,-65)
);

// Low skyline blocks add depth without heavy geometry.
for(let i=0;i<18;i++){
  const side=i%2===0?-1:1;
  const h=THREE.MathUtils.randFloat(5,11);
  const skyline=box(
    THREE.MathUtils.randFloat(2.5,4.5), h,
    THREE.MathUtils.randFloat(3,5),
    new THREE.MeshStandardMaterial({
      color: [0x77899a,0x66788a,0x8b7f73][i%3],
      roughness:.95
    }),
    side*THREE.MathUtils.randFloat(14,19),
    h/2,
    -30-i*8
  );
  scene.add(skyline);
}


// Lane markings as repeating segments
const markings=[];
for(let z=-150;z<20;z+=7){
  for(const x of [-2,2]){
    const mark=box(.12,.025,3.2,whiteMat,x,.01,z);
    markings.push(mark); scene.add(mark);
  }
}

// Environment
const buildings=[];
const windowsMat = new THREE.MeshStandardMaterial({color:0x8ed8ff,emissive:0x163a50,emissiveIntensity:.35});
function makeBuilding(x,z){
  const h=THREE.MathUtils.randFloat(8,18);
  const w=THREE.MathUtils.randFloat(3.5,6.5);
  const d=THREE.MathUtils.randFloat(4,7);
  const mats=[
    new THREE.MeshStandardMaterial({color:0xb9a48e,roughness:.9}),
    new THREE.MeshStandardMaterial({color:0x7189a0,roughness:.9}),
    new THREE.MeshStandardMaterial({color:0xc57e63,roughness:.9}),
    new THREE.MeshStandardMaterial({color:0x8c9b76,roughness:.9})
  ];
  const b=box(w,h,d,mats[Math.floor(Math.random()*mats.length)],x,h/2,z);
  scene.add(b); buildings.push(b);

  // A few windows on the front side
  for(let yy=3;yy<h-1;yy+=3){
    for(let xx=-w/2+0.8;xx<w/2-0.4;xx+=1.45){
      const win=box(.55,.85,.035,windowsMat,x+xx,yy,z-d/2-.02);
      scene.add(win);
      buildings.push(win);
    }
  }
}
for(let z=-12;z>-145;z-=13){
  makeBuilding(-11,z);
  makeBuilding(11,z-THREE.MathUtils.randFloat(-4,4));
}

// Street lights
const lamps=[];
function makeLamp(x,z){
  const pole=box(.12,4.5,.12,darkMat,x,2.25,z);
  const arm=box(.9,.1,.1,darkMat,x+(x<0?.42:-.42),4.45,z);
  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(.18,10,10),
    new THREE.MeshStandardMaterial({color:0xfff0ad,emissive:0xffc94a,emissiveIntensity:2})
  );
  glow.position.set(x+(x<0?.82:-.82),4.28,z);
  scene.add(pole,arm,glow);
  lamps.push(pole,arm,glow);
}
for(let z=-10;z>-150;z-=14){makeLamp(-6.7,z);makeLamp(6.7,z-7)}

// Player: smaller, proportioned low-poly runner
const player=new THREE.Group();
player.position.set(0,0,4.5);
scene.add(player);

const body=new THREE.Group();
player.add(body);

const torso=box(.92,1.28,.52,shirtMat,0,2.25,0);
body.add(torso);

const jacketStripe=box(.94,.10,.535,whiteMat,0,2.38,-.01);
body.add(jacketStripe);

const neck=box(.25,.22,.25,skinMat,0,3.02,0);
body.add(neck);

const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skinMat);
head.position.set(0,3.48,0);
head.castShadow=true;
body.add(head);

// Hair
const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.395,16,8,0,Math.PI*2,0,Math.PI*.48),
  darkMat
);
hair.position.set(0,3.54,0);
hair.castShadow=true;
body.add(hair);

function limb(w,h,d,mat,x,y,z){
  const pivot=new THREE.Group();
  pivot.position.set(x,y,z);
  const part=box(w,h,d,mat,0,-h/2,0);
  pivot.add(part);
  body.add(pivot);
  return pivot;
}

const leftArm=limb(.24,.72,.24,shirtMat,-.68,2.78,0);
const rightArm=limb(.24,.72,.24,shirtMat,.68,2.78,0);

const leftFore=limb(.20,.58,.20,skinMat,-.68,2.08,0);
const rightFore=limb(.20,.58,.20,skinMat,.68,2.08,0);

const leftThigh=limb(.32,.72,.32,pantsMat,-.28,1.58,0);
const rightThigh=limb(.32,.72,.32,pantsMat,.28,1.58,0);

const leftShin=limb(.27,.70,.27,pantsMat,-.28,.86,0);
const rightShin=limb(.27,.70,.27,pantsMat,.28,.86,0);

const leftShoe=box(.34,.18,.65,shoeMat,-.28,.12,-.13);
const rightShoe=box(.34,.18,.65,shoeMat,.28,.12,-.13);
body.add(leftShoe,rightShoe);

// Slightly scale the complete character down
player.scale.setScalar(.76);

// Subtle motion streaks near the road edges.
const motionStreaks=[];
const streakMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.16});
for(let i=0;i<18;i++){
  const s=box(.035,.025,THREE.MathUtils.randFloat(.8,2.2),streakMat,
    (i%2?-1:1)*THREE.MathUtils.randFloat(5.8,8.5),.035,-15-i*7);
  motionStreaks.push(s); scene.add(s);
}

// Obstacles
const obstacles=[];
function makeObstacle(z){
  const g=new THREE.Group();
  const xLane=THREE.MathUtils.randInt(0,2)-1;
  g.position.set(xLane*4,0,z);

  const bar=box(2.25,0.85,.38,new THREE.MeshStandardMaterial({color:0xe53935,roughness:.65}),0,.55,0);
  const stripe1=box(.32,.87,.4,yellowMat,-.72,.55,0);
  const stripe2=box(.32,.87,.4,yellowMat,.72,.55,0);
  const leg1=box(.22,.65,.28,darkMat,-.88,.28,0);
  const leg2=box(.22,.65,.28,darkMat,.88,.28,0);
  g.add(bar,stripe1,stripe2,leg1,leg2);
  scene.add(g);
  obstacles.push(g);
}

// Coins
const coins=[];
const coinGeo=new THREE.TorusGeometry(.25,.08,10,20);
const coinMat=new THREE.MeshStandardMaterial({color:0xffd21f,metalness:.7,roughness:.25,emissive:0x6b4500,emissiveIntensity:.25});
function makeCoin(z){
  const c=new THREE.Mesh(coinGeo,coinMat);
  c.position.set((THREE.MathUtils.randInt(0,2)-1)*4,THREE.MathUtils.randFloat(1.2,2.2),z);
  c.rotation.y=Math.PI/2;
  c.castShadow=true;
  scene.add(c);coins.push(c);
}

// Initial objects
for(let i=0;i<8;i++) makeObstacle(-35-i*22);
for(let i=0;i<18;i++) makeCoin(-18-i*9);

// Game state
let lane=0;
const lanes=[-1,0,1];
let targetX=0;
let yVel=0;
let grounded=true;
let distance=0;
let score=0;
let coinCount=0;
let speed=10.5;
let spawnTimer=0;
let last=performance.now();
let gameStarted=false;
let gameOver=false;

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const message=document.getElementById("message");

function startGame(){
  if(gameStarted)return;
  gameStarted=true;
  message.classList.add("hidden");
}
setTimeout(startGame,1400);

function jump(){
  if(!grounded || gameOver)return;
  yVel=9.2;
  grounded=false;
}

function moveLane(dir){
  if(gameOver)return;
  lane=Math.max(-1,Math.min(1,lane+dir));
  targetX=lanes[lane]*4;
}

function restart(){
  location.reload();
}

// Touch swipe controls
let sx=0,sy=0,st=0;
renderer.domElement.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];
  sx=t.clientX;sy=t.clientY;st=performance.now();
},{passive:true});

renderer.domElement.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-sx,dy=t.clientY-sy;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx<25 && ady<25){ if(gameOver) restart(); return; }
  if(Math.max(adx,ady)<35)return;
  if(adx>ady) moveLane(dx>0?1:-1);
  else if(dy<-25) jump();
},{passive:true});

// Keyboard fallback
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveLane(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveLane(1);
  if(e.key==="ArrowUp"||e.key===" ")jump();
  if(gameOver && e.key.toLowerCase()==="r")restart();
});

// Collision helper
function playerBox(){
  // Use a simple central box so arms/legs don't cause unfair collisions
  return new THREE.Box3(
    new THREE.Vector3(player.position.x-.42,player.position.y+.05,player.position.z-.32),
    new THREE.Vector3(player.position.x+.42,player.position.y+2.65,player.position.z+.32)
  );
}

function obstacleBox(o){
  return new THREE.Box3().setFromObject(o);
}

function endGame(){
  gameOver=true;
  message.classList.remove("hidden");
  message.innerHTML="<b>GAME OVER</b><small>Score: "+Math.floor(score)+"<br>Swipe/tap to restart</small>";
}

function updatePlayer(dt){
  player.position.x += (targetX-player.position.x)*Math.min(1,dt*10);

  // Actual forward movement + camera follows.
  player.position.z -= speed*dt;

  // Keep player near the camera by shifting the environment back when needed.
  const dz=player.position.z-4.5;
  if(dz<-18){
    const shift=-dz;
    player.position.z+=shift;
    for(const o of obstacles)o.position.z+=shift;
    for(const c of coins)c.position.z+=shift;
    for(const m of markings)m.position.z+=shift;
    for(const b of buildings)b.position.z+=shift;
    for(const l of lamps)l.position.z+=shift;
    for(const s of motionStreaks)s.position.z+=shift;
  }

  yVel-=24*dt;
  player.position.y+=yVel*dt;
  if(player.position.y<=0){
    player.position.y=0;yVel=0;grounded=true;
  }

  // Running animation: legs and arms visibly move.
  const runT=performance.now()*.012*(speed/10.5);
  const swing=Math.sin(runT)*.65;
  leftThigh.rotation.x=swing;
  rightThigh.rotation.x=-swing;
  leftShin.rotation.x=-Math.max(0,-swing)*.7;
  rightShin.rotation.x=-Math.max(0,swing)*.7;
  leftArm.rotation.x=-swing*.75;
  rightArm.rotation.x=swing*.75;
  leftFore.rotation.x=-swing*.45;
  rightFore.rotation.x=swing*.45;
  body.position.y=Math.abs(Math.sin(runT*2))*.035;
  body.rotation.z=(targetX-player.position.x)*-.025;
}

function recycleObjects(dt){
  spawnTimer+=dt;
  if(spawnTimer>1.7){
    spawnTimer=0;
    makeObstacle(player.position.z-85-speed*2);
  }

  // Move world objects toward camera to create the endless-road illusion.
  // Player itself is also physically moving forward, so the running animation
  // and camera motion make the forward movement visible.
  const worldMove=speed*dt;
  for(const o of obstacles)o.position.z+=worldMove;
  for(const c of coins)c.position.z+=worldMove;
  for(const m of markings)m.position.z+=worldMove;
  for(const b of buildings)b.position.z+=worldMove;
  for(const l of lamps)l.position.z+=worldMove;
  for(const s of motionStreaks)s.position.z+=worldMove;

  // Remove/recycle distant objects
  for(let i=obstacles.length-1;i>=0;i--){
    if(obstacles[i].position.z>18){
      scene.remove(obstacles[i]);
      obstacles.splice(i,1);
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.rotation.z+=dt*5;
    c.rotation.x+=dt*2;
    if(c.position.z>18){
      scene.remove(c);coins.splice(i,1);
    }
  }

  // Keep enough coins
  while(coins.length<18)makeCoin(player.position.z-THREE.MathUtils.randFloat(45,130));
}

function checkCollisions(){
  const p=playerBox();

  for(const o of obstacles){
    if(Math.abs(o.position.z-player.position.z)<1.25 &&
       Math.abs(o.position.x-player.position.x)<1.45){
      const ob=obstacleBox(o);
      if(p.intersectsBox(ob)){
        endGame(); return;
      }
    }
  }

  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(Math.abs(c.position.z-player.position.z)<1.15 &&
       Math.abs(c.position.x-player.position.x)<1.25 &&
       Math.abs(c.position.y-(player.position.y+1.5))<1.4){
      coinCount++;
      score+=50;
      scene.remove(c);coins.splice(i,1);
    }
  }
}

function updateCamera(dt){
  // Professional third-person chase camera:
  // farther back, slightly above the runner, with a gentle follow.
  const desiredX = player.position.x * 0.55;
  const desiredY = 4.35 + player.position.y * 0.12;
  const desiredZ = player.position.z + 11.8;

  camera.position.x += (desiredX - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (desiredY - camera.position.y) * Math.min(1, dt * 5);
  camera.position.z += (desiredZ - camera.position.z) * Math.min(1, dt * 6);

  const lookX = player.position.x * 0.12;
  const lookY = 1.75 + player.position.y * 0.10;
  const lookZ = player.position.z - 8.5;
  camera.lookAt(lookX, lookY, lookZ);
  camera.fov += ((58 + Math.min(5, (speed - 10.5) * 0.45)) - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();
}

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.035,(now-last)/1000);last=now;

  if(gameStarted && !gameOver){
    speed=Math.min(18,10.5+distance*.002);
    distance+=speed*dt;
    score+=speed*dt*.45;

    updatePlayer(dt);
    recycleObjects(dt);
    checkCollisions();
    updateCamera(dt);

    scoreEl.textContent=Math.floor(score);
    coinsEl.textContent=coinCount;
  }else{
    // Idle camera/player animation before starting
    updateCamera(dt);
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
